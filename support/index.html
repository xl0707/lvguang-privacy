<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f2ec">
    <title>履光技术支持 / Lvguang Support</title>
    <meta name="description" content="履光 iOS App 技术支持与联系方式。">
    <style>
      :root { --ink:#20231f; --muted:#656961; --line:#dcded6; --paper:#f4f2ec; --green:#315b45; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:radial-gradient(circle at 78% 20%,rgba(126,160,133,.14),transparent 30rem),var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif; text-rendering:optimizeLegibility; }
      .header { display:flex; align-items:center; justify-content:space-between; min-height:68px; padding:0 5vw; border-bottom:1px solid rgba(49,91,69,.14); }
      .brand { display:flex; align-items:center; gap:10px; font-weight:700; }
      .brand small { color:var(--muted); font-size:.72em; font-weight:500; }
      .brand-mark { display:grid; width:34px; height:34px; place-items:center; border-radius:11px; background:var(--green); color:#fff; font-family:"STKaiti","KaiTi",serif; }
      .page-name { color:var(--muted); font-size:14px; }
      .main { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(280px,.7fr); gap:clamp(48px,8vw,120px); width:min(1180px,90vw); min-height:calc(100vh - 157px); margin:0 auto; padding:clamp(72px,11vw,148px) 0 84px; }
      .hero { max-width:740px; }
      .eyebrow { margin:0; color:var(--green); font-size:13px; font-weight:750; letter-spacing:.13em; }
      h1 { margin:18px 0 24px; font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif; font-size:clamp(52px,7.5vw,96px); font-weight:600; letter-spacing:-.055em; line-height:1.04; }
      .lede { max-width:650px; margin:0; color:var(--muted); font-size:clamp(18px,2vw,23px); line-height:1.7; }
      .contact-card { display:grid; grid-template-columns:52px minmax(0,1fr); gap:20px; max-width:580px; margin-top:clamp(52px,7vw,82px); padding:26px 28px; border-radius:22px; background:var(--green); box-shadow:0 18px 45px rgba(39,65,49,.16); color:#fff; text-decoration:none; transition:transform 180ms ease,box-shadow 180ms ease; }
      .contact-card:hover { transform:translateY(-3px); box-shadow:0 24px 55px rgba(39,65,49,.22); }
      .contact-card:focus-visible { outline:3px solid #9dbda6; outline-offset:4px; }
      .icon { display:grid; width:52px; height:52px; place-items:center; border:1px solid rgba(255,255,255,.28); border-radius:50%; font-size:24px; }
      .contact-copy { display:flex; min-width:0; flex-direction:column; }
      .contact-copy small { color:rgba(255,255,255,.7); font-size:12px; letter-spacing:.08em; }
      .contact-copy strong { overflow-wrap:anywhere; font-size:clamp(18px,2.3vw,25px); }
      .contact-copy span { margin-top:2px; color:rgba(255,255,255,.72); font-size:13px; }
      .note { display:grid; grid-template-columns:42px 1fr; gap:18px; align-self:end; padding-top:22px; border-top:1px solid var(--line); }
      .note-index { color:var(--green); font-size:13px; font-weight:750; }
      .note h2 { margin:-5px 0 12px; font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif; font-size:25px; }
      .note p { margin:0; color:var(--muted); font-size:14px; line-height:1.75; }
      .note .privacy-note { margin-top:15px; color:#785d4b; }
      .footer { display:flex; justify-content:space-between; width:min(1180px,90vw); margin:0 auto; padding:26px 0 34px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
      @media (max-width:760px) {
        .header { padding:0 20px; }
        .main { grid-template-columns:1fr; gap:72px; width:min(100% - 40px,680px); min-height:auto; padding:68px 0 72px; }
        h1 { font-size:clamp(48px,15vw,68px); }
        .contact-card { grid-template-columns:46px minmax(0,1fr); padding:22px; }
        .icon { width:46px; height:46px; }
        .footer { align-items:flex-start; flex-direction:column; gap:5px; width:min(100% - 40px,680px); }
      }
      @media (prefers-reduced-motion:reduce) { .contact-card { transition:none; } }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="brand" aria-label="履光"><span class="brand-mark" aria-hidden="true">履</span><span>履光 <small>Lvguang</small></span></div>
      <span class="page-name">技术支持</span>
    </header>
    <main class="main">
      <section class="hero" aria-labelledby="support-title">
        <p class="eyebrow">LVGUANG SUPPORT · iOS</p>
        <h1 id="support-title">需要帮助？<br>我们在这里。</h1>
        <p class="lede">如果你在使用履光时遇到问题，或希望提出建议，请通过电子邮件联系我们。</p>
        <a class="contact-card" href="mailto:su_junyu@outlook.com?subject=%E5%B1%A5%E5%85%89%E6%8A%80%E6%9C%AF%E6%94%AF%E6%8C%81">
          <span class="icon" aria-hidden="true">↗</span>
          <span class="contact-copy"><small>联系我们</small><strong>su_junyu@outlook.com</strong><span>打开邮件 App</span></span>
        </a>
      </section>
      <aside class="note" aria-labelledby="email-note-title">
        <span class="note-index">01</span>
        <div>
          <h2 id="email-note-title">发送邮件时</h2>
          <p>请简单说明遇到的问题、使用的 iPhone 型号和 iOS 版本，以便我们更快了解情况。</p>
          <p class="privacy-note">请勿通过邮件发送身份证件、成绩单或隐私保险箱中的原始文件。</p>
        </div>
      </aside>
    </main>
    <footer class="footer"><span>履光 Lvguang</span><span>记录经历，留住成长</span></footer>
  </body>
</html>
